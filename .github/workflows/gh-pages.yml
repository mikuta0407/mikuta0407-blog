name: GitHub Pages

on:
  push:
    branches:
      - main  # Set a branch to deploy
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.128.2'
          extended: true

      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          # キャッシュ対象ディレクトリ (hugo.toml等で変更していなければ 'resources')
          path: resources 
          # キャッシュのキー。設定ファイルやモジュール定義ファイルが変更されたらキャッシュを無効化する
          key: ${{ runner.os }}-hugo-${{ hashFiles('**/hugo.toml', '**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: blog.mikuta0407.net